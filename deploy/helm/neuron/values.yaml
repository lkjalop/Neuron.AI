image:
  repository: your-registry/neuron-ai
  tag: latest
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 8000

ingress:
  enabled: true
  className: ""
  hosts:
    - host: neuron.local
      paths:
        - path: /
          pathType: Prefix
  tls: []

resources: {}

env:
  PREDICT_API_KEY: "predictkey"
  PROMETHEUS_URL: "http://prometheus:9090"
  GRAFANA_BASE_URL: "http://grafana:3000"
  # ADMIN_API_KEY: "adminkey"
  # GRAFANA_TOKEN: ""

cloud:
  profile: generic # aws|azure|gcp|generic
  aws: {}
  azure: {}
  gcp: {}
