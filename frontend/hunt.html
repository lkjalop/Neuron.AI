<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>IOC & Hunt</title>
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <link rel="stylesheet" href="/style.css" />
  <style>
    body { padding:12px; }
    table { border-collapse: collapse; width: 100%; margin-top: 1rem; }
    th, td { border: 1px solid #2a313d; padding: .35rem .5rem; font-size: .85rem; }
    th { background: #161b22; text-align:left; }
    .controls { display:flex; gap:.75rem; align-items:center; flex-wrap:wrap; }
  </style>
</head>
<body>
  <h1 style="margin-top:0">IOC & Hunt</h1>
  <div class="controls">
    <label>API Key <input id="apiKey" type="password" placeholder="x-api-key" style="width:160px;"></label>
    <input id="iocValue" placeholder="IOC value" />
    <select id="iocType">
      <option value="hash" selected>hash</option>
      <option value="ip">ip</option>
      <option value="domain">domain</option>
    </select>
    <button id="addIoc">Add IOC</button>
    <input id="huntQuery" placeholder="hunt pattern" style="min-width:240px;"/>
    <button id="runHunt">Run Hunt</button>
    <button id="refresh">Refresh List</button>
  </div>
  <section>
    <h2>IOCs</h2>
    <table id="iocTable"><thead><tr><th>ID</th><th>Value</th><th>Type</th><th>Added</th></tr></thead><tbody></tbody></table>
  </section>
  <section>
    <h2>Hunt Results</h2>
    <table id="huntTable"><thead><tr><th>Value</th><th>Type</th></tr></thead><tbody></tbody></table>
  </section>
  <script src="/app/hunt.js"></script>
</body>
</html>
